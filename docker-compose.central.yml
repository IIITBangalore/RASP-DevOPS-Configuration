services:
  keycloakdb:
    image: postgres:17.7
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_db_user
      POSTGRES_PASSWORD: keycloak_db_user_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak_db_user -d keycloak_db" ]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    ports:
      - "9080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloakdb:5432/keycloak_db
      KC_DB_USERNAME: keycloak_db_user
      KC_DB_PASSWORD: keycloak_db_user_password
      KC_HEALTH_ENABLED: true
    depends_on:
      keycloakdb:
        condition: service_healthy
    volumes:
      - ./dev_keycloak_realm_data:/opt/keycloak/data/import
    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/health/live']
      interval: 5s
      timeout: 20s
      retries: 30
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017" # Exposed so local rasp-rbac instances can reach it
    networks:
      - default
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 3s
      timeout: 20s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  collab-server:
    image: ${COLLAB_SERVER_IMAGE:-172.16.202.56:5000/collab-server:latest}
    container_name: collab-server
    ports:
      - "8088:8088"
    environment:
      - DB_SERVER=mongo
      - DB_PORT=27017
      - KEYCLOAK_HOST=http://${HOST_IP:-127.0.0.1}
      - KEYCLOAK_PORT=9080
      - SERVER_PORT=8088
      - SERVER_HOST=http://${HOST_IP:-127.0.0.1}
      - FRONTEND_URL=http://${HOST_IP:-127.0.0.1}:80
      - CLIENT_ID=backend-api
      - CLIENT_SECRET=pUY0svMeiBpfx4oUfuvq4NLWijST1fiz
      - REALM=myRealm
      - DEMO_RASP_BACKEND=/app/rasp_backend
      - DMS_PORT=8085
      - DMS_HOST=http://${HOST_IP:-127.0.0.1}
      - RASP_GENERATED_PROJECT=/generated
      - INTERNAL_TOKEN=qwewqdwqdewq
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  rasp-rbac:
    image: ${RBAC_IMAGE:-172.16.202.56:5000/rasp-rbac:latest}
    container_name: rasp-rbac
    ports:
      - "9082:9082"
    entrypoint: [ "sh", "-c", "sleep 15 && exec java -jar app.jar" ]
    environment:
      - CLIENT_ID=backend-api
      - CLIENT_SECRET=pUY0svMeiBpfx4oUfuvq4NLWijST1fiz
      - DEMO_RASP_BACKEND=/app/rasp_backend
      - DMS_HOST=http://${HOST_IP:-127.0.0.1}
      - DMS_PORT=8085
      - FRONTEND_URL=http://${HOST_IP:-127.0.0.1}:80
      - KEYCLOAK_HOST=http://keycloak
      - KEYCLOAK_PORT=8080
      - RASP_GENERATED_PROJECT=/generated
      - REALM=myRealm
      - SERVER_HOST=http://${HOST_IP:-127.0.0.1}
      - SERVER_PORT=9082
      - DB_SERVER=mongo
      - DB_PORT=27017
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ${GENERATED_PATH:-/opt/rasp/generated}:/generated
      - ${SOURCE_PROJECT_PATH:-/opt/rasp/rasp_backend_source}:/app/rasp_backend
    restart: unless-stopped

  # ----------------------------------------------------------
  # IR-To-Code — AST / Code Generation Service (Java 17 / Spring Boot)
  # Builds from the IR-To-Code repo source.
  # Set IR_TO_CODE_IMAGE to use a pre-built registry image instead.
  # ----------------------------------------------------------
  ir-to-code:
    image: ${IR_TO_CODE_IMAGE:-172.16.202.56:5000/ir-to-code:latest}
    build:
      context: ${IR_TO_CODE_BUILD_CONTEXT:-../IR-To-Code}
      dockerfile: Dockerfile
      target: runtime
    container_name: ir-to-code
    restart: unless-stopped
    environment:
      # Spring Boot server port (matches application.yml)
      SERVER_PORT: "8082"
      GENERATED_PROJECT: "/app/generated-project"
      # JVM container-aware flags — override via IR_TO_CODE_JAVA_OPTS if needed
      JAVA_OPTS: "${IR_TO_CODE_JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom}"
    ports:
      - "${IR_TO_CODE_PORT:-8082}:8082"
    volumes:
      # Mount generated project output to a named volume so it is
      # accessible to other services (e.g. rasp-rbac) if needed
      - ir_to_code_generated:/app/generated-project
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/v1/generator/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default

  # ----------------------------------------------------------
  # AI Code Generation Service (Python / FastAPI + LangGraph)
  # Builds from the AI-Code-Generation repo source.
  # Set AI_CODEGEN_IMAGE to use a pre-built registry image instead.
  # ----------------------------------------------------------
  ai-codegen:
    image: ${AI_CODEGEN_IMAGE:-172.16.202.56:5000/ai-codegen:latest}
    build:
      context: ${AI_CODEGEN_BUILD_CONTEXT:-../AI-Code-Generation}
      dockerfile: Dockerfile
      target: runtime
    container_name: ai-codegen
    restart: unless-stopped
    env_file:
      # Create this file on the server from AI-Code-Generation/.env.example
      - ${AI_CODEGEN_ENV_FILE:-/home/darshan/rasp-central/example.env}
    environment:
      # Always point to the shared platform MongoDB — overrides any .env value
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      # Point at the AST service container on the Docker-internal network
      JAVA_AST_CODE_GENERATOR_HOST: http://ir-to-code
      JAVA_AST_CODE_GENERATOR_PORT: "8082"
    ports:
      - "${AI_CODEGEN_PORT:-9000}:9000"
    depends_on:
      mongo:
        condition: service_healthy
      ir-to-code:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/docs')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default

volumes:
  postgres_data:
  mongo_data:
  ir_to_code_generated:
