# ============================================================
#  NGINX Reverse Proxy Configuration for RASP Central Server
#  Place this at /etc/nginx/conf.d/rasp.conf on the central host
# ============================================================

# Rate limiting zone (shared across workers)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ── Upstream definitions ────────────────────────────────────
upstream keycloak   { server 127.0.0.1:9080; }
upstream collab     { server 127.0.0.1:8088; }
upstream rbac       { server 127.0.0.1:9082; }

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server ──────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── SSL certificates (use certbot or your own) ──
    ssl_certificate     /etc/nginx/ssl/rasp.crt;
    ssl_certificate_key /etc/nginx/ssl/rasp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ──
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection      "1; mode=block" always;

    # ── Keycloak ──
    location /auth/ {
        proxy_pass         http://keycloak;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    # ── RBAC Service ──
    location /api/rbac/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://rbac/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Collab Server (WebSocket support) ──
    location /api/collab/ {
        proxy_pass         http://collab/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ── Default: block direct access ──
    location / {
        return 444;
    }
}
