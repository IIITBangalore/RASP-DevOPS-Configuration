services:
  mysql:
    image: mysql:latest
    container_name: ${PROJECT_NAME}-mysql
    ports:
      - "${PORT_DB:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: deployment_db_collab
    volumes:
      - mysql_data:/var/lib/mysql # ✅ FIXED
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rasp-designer-fe:
    image: 172.16.202.56:5000/rasp-designer-fe:latest1
    container_name: ${PROJECT_NAME}-fe
    ports:
      - "${PORT_FE:-80}:80"
    depends_on:
      - rasp-designer-be
    environment:
      # - MY_PREFIX_REACT_APP_NODEJS_BACKEND_URL=http://${HOST_IP:-127.0.0.1}:${PORT_BE:-9000}
      - MY_PREFIX_REACT_APP_NODEJS_BACKEND_URL=http://localhost:${PORT_BE:-9000}
      - ASSET_DIR=/usr/share/nginx/html
      - APP_PREFIX=MY_PREFIX_
    restart: unless-stopped

  rasp-designer-be:
    image: 172.16.202.56:5000/rasp-designer-be:latest
    container_name: ${PROJECT_NAME}-be
    ports:
      - "${PORT_BE:-9000}:8000"
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - DATABASE_URL=mysql://root:root@${PROJECT_NAME}-mysql:3306/deployment_db_collab
      # - DATABASE_URL=mysql://root:root@$172.17.0.1:8002/deployment_db_collab
      - KEYCLOAK_URL=http://${CENTRAL_IP:-172.16.202.56}:9080
      - REALM=myRealm
      - CLIENT_ID=backend-api
      - CLIENT_SECRET=pUY0svMeiBpfx4oUfuvq4NLWijST1fiz
      # - REDIRECT_URI=http://${HOST_IP:-127.0.0.1}:${PORT_BE:-9000}/auth/callback
      - REDIRECT_URI=http://localhost:${PORT_BE:-9000}/auth/callback
      # - FRONTEND_URL=http://${HOST_IP:-127.0.0.1}:${PORT_FE:-80}
      - FRONTEND_URL=http://localhost:${PORT_FE:-80}
      - SERVER_HOSTNAME=${PROJECT_NAME}-localhost
      - SERVER_PORT=8000
      - GENERATOR_URL=http://${CENTRAL_IP:-172.16.202.56}:9082/api
      - COLLABORATION_URL=http://${CENTRAL_IP:-172.16.202.56}:8088/api
      - REACT_APP_URL=http://${HOST_IP:-127.0.0.1}:3001
      - INTERNAL_TOKEN=qwewqdwqdewq
      - RASP_VERSION=0.8
      - WORKFLOW_HOST=${PROJECT_NAME}-workflow
      - WORKFLOW_PORT=9000
      - WORKFLOW_IDS=[]
      - GENERATED_WORKFLOW_URL=http://${PROJECT_NAME}-workflow:9000/api
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  dms-rasp:
    image: 172.16.202.56:5000/dms-rasp:latest
    container_name: ${PROJECT_NAME}-dms
    ports:
      - "${PORT_DMS:-8085}:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${CENTRAL_IP:-172.16.202.56}:27017/traveler_db
      - KEYCLOAK_AUTH_SERVER_URL=http://${CENTRAL_IP:-172.16.202.56}:9080/auth
      - FILE_UPLOAD_DIR=/app/uploads
    volumes:
      - dms_uploads:/app/uploads # ✅ FIXED
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    container_name: ${PROJECT_NAME}-vault
    ports:
      - "${PORT_VAULT}:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=myroot
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: vault server -dev -dev-root-token-id=myroot
    volumes:
      - vault_data:/vault/file # ✅ persistence
    restart: unless-stopped

  workflow-service:
    image: 172.16.202.56:5000/workflow-service:latest
    container_name: ${PROJECT_NAME}-workflow
    ports:
      - "${PORT_WORKFLOW}:9000"
    environment:
      - VAULT_ADDR=http://${PROJECT_NAME}-vault:8200
      - VAULT_TOKEN=myroot

      # ✅ CENTRAL MONGO (correct)
      - MONGO_URI=mongodb://${CENTRAL_IP}:27017
      - MONGO_PORT=27017
      - MONGO_HOST=${CENTRAL_IP}

      - CHEKPOINTERS_DB=langgraph_memory
      - COLLECTION_NAME=checkpoints
      - WORKFLOW_DB=workflows
      - EXECUTIONS_COLLECTION=executions
    depends_on:
      - vault
    restart: unless-stopped
volumes:
  mysql_data: # ✅ FIXED
  dms_uploads: # ✅ FIXED
  vault_data:
