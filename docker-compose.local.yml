services:
  mysql:
    image: mysql:latest
    container_name: ${PROJECT_NAME}-mysql
    ports:
      - "${PORT_DB:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: visual_app_design
    volumes:
      - ${PROJECT_NAME}_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1" ]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rasp-designer-fe:
    image: 172.16.202.56:5000/rasp-designer-fe:latest
    container_name: ${PROJECT_NAME}-fe
    ports:
      - "${PORT_FE:-80}:80"
    depends_on:
      - rasp-designer-be
    environment:
      - MY_PREFIX_REACT_APP_NODEJS_BACKEND_URL=http://${HOST_IP:-127.0.0.1}:${PORT_BE:-9000}
      - ASSET_DIR=/usr/share/nginx/html
      - APP_PREFIX=MY_PREFIX_
    restart: unless-stopped

  rasp-designer-be:
    image: 172.16.202.56:5000/rasp-designer-be:latest
    container_name: ${PROJECT_NAME}-be
    ports:
      - "${PORT_BE:-9000}:8000"
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - DATABASE_URL=mysql://root:root@${PROJECT_NAME}-mysql:3306/visual_app_design
      - KEYCLOAK_URL=http://${HOST_IP:-127.0.0.1}:9080
      - REALM=myRealm
      - CLIENT_ID=myClient
      - CLIENT_SECRET=ucdSNdfI63rWmpsDz2uUKDpODa8K7oz5
      - REDIRECT_URI=http://${HOST_IP:-127.0.0.1}:${PORT_BE:-9000}/auth/callback
      - FRONTEND_URL=http://${HOST_IP:-127.0.0.1}:${PORT_FE:-80}
      - SERVER_HOSTNAME=${PROJECT_NAME}-localhost
      - SERVER_PORT=8000
      - GENERATOR_URL=http://${HOST_IP:-127.0.0.1}:${PORT_RBAC:-9082}/api
      - COLLABORATION_URL=http://${HOST_IP:-127.0.0.1}:8088/api
      - REACT_APP_URL=http://${HOST_IP:-127.0.0.1}:3001
      - INTERNAL_TOKEN=qwewqdwqdewq
      - RASP_VERSION=0.8
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  rasp-rbac:
    image: 172.16.202.56:5000/rasp-rbac:latest
    container_name: ${PROJECT_NAME}-rbac
    ports:
      - "${PORT_RBAC:-9082}:9082"
    entrypoint: [ "sh", "-c", "sleep 15 && exec java -jar app.jar" ]
    environment:
      - CLIENT_ID=adi-rest-api
      - CLIENT_SECRET=RnxVQ0TTbwETlZeN7k3lXZB78fFUt0sF
      - DEMO_RASP_BACKEND=/app/rasp_backend
      - DMS_HOST=http://${HOST_IP:-127.0.0.1}
      - DMS_PORT=${PORT_DMS:-8085}
      - FRONTEND_URL=http://${HOST_IP:-127.0.0.1}:${PORT_FE:-80}
      - KEYCLOAK_HOST=http://${HOST_IP:-127.0.0.1}
      - KEYCLOAK_PORT=9080
      - RASP_GENERATED_PROJECT=/generated
      - REALM=myRealm
      - SERVER_HOST=http://${HOST_IP:-127.0.0.1}
      - SERVER_PORT=9082
      # Point to central mongo instance using host IP.
      - DB_SERVER=${HOST_IP:-host.docker.internal}
      - DB_PORT=27017
    volumes:
      - ${GENERATED_PATH:-D:/RASP/generated}/${PROJECT_NAME}:/generated
      - ${SOURCE_PROJECT_PATH:-D:/RASP/RASP-Backend-Generator}:/app/rasp_backend
    restart: unless-stopped

  dms-rasp:
    image: 172.16.202.56:5000/dms-rasp:latest
    build:
      context: ../DMS-RASP
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-dms
    ports:
      - "${PORT_DMS:-8085}:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${HOST_IP:-host.docker.internal}:27017/traveler_db
      - KEYCLOAK_AUTH_SERVER_URL=http://${HOST_IP:-127.0.0.1}:9080/auth
      - FILE_UPLOAD_DIR=/app/uploads
    volumes:
      - ${PROJECT_NAME}_dms_uploads:/app/uploads
    restart: unless-stopped

volumes:
  ${PROJECT_NAME}_mysql_data:
  ${PROJECT_NAME}_dms_uploads:
